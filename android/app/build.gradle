plugins {
    id 'com.android.application'
}

android {
    namespace 'app.vercel.myvritta'
    compileSdk 35

    defaultConfig {
        applicationId 'app.vercel.myvritta'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        manifestPlaceholders = [
            hostName: "myvritta.vercel.app",
            defaultUrl: "https://myvritta.vercel.app",
            assetStatements: '[{ "relation": ["delegate_permission/common.handle_all_urls"], "target": { "namespace": "android_app", "package_name": "app.vercel.myvritta", "sha256_cert_fingerprints": ["6C:2C:5D:84:B4:80:28:8B:CA:4B:CD:5B:A0:E6:13:D4:A8:6F:48:C5:F5:B2:9F:40:50:A0:BF:18:17:B6:DF:61"] }}]'
        ]
    }

    signingConfigs {
        release {
            storeFile file('../keystore/vritta-release.keystore')
            storePassword 'vrittapass'
            keyAlias 'vritta'
            keyPassword 'vrittapass'
        }
        debug {
            storeFile file('../keystore/vritta-release.keystore')
            storePassword 'vrittapass'
            keyAlias 'vritta'
            keyPassword 'vrittapass'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
